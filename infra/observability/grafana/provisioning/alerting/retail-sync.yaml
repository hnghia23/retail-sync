# Ngưỡng cảnh báo docs/08 §5 + docs/17 §6 — provision vào Grafana của otel-lgtm lúc khởi động.
# SINH TỪ infra/observability/build_alerts.py — sửa ở đó (và docs/08 §5), không sửa tay file này.
# Không có rule cho độ tươi: ngoài giờ bán nó tăng là bình thường — cần lịch giờ mở cửa trước.
# Thông báo: webhook → alert-sink (compose) ghi lại mọi lần kêu/hết kêu.
# (YAML là tập cha của JSON: file này là JSON để không cần thư viện YAML khi sinh.)
{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "luong-du-lieu",
      "folder": "retail-sync",
      "interval": "1m",
      "rules": [
        {
          "uid": "rs-drift",
          "title": "Lệch INV-4: số dư điểm ≠ Σ sổ cái",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(reconcile_drift_count)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "max"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "0s",
          "labels": {
            "severity": "critical",
            "project": "retail-sync"
          },
          "annotations": {
            "summary": "Lệch INV-4: số dư điểm ≠ Σ sổ cái",
            "description": "Sai số điểm là sai tiền của khách (docs/08 §5 reconcile_drift_count). Xem bảng reconciliation_drift."
          }
        },
        {
          "uid": "rs-audit-diverged",
          "title": "Đối soát xuyên tầng DIVERGED",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "max(audit_status)",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "B",
                "type": "reduce",
                "expression": "A",
                "reducer": "max"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "model": {
                "refId": "C",
                "type": "threshold",
                "expression": "B",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        1
                      ]
                    }
                  }
