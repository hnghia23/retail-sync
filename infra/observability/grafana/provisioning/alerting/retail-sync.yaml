          "execErrState": "Error",
          "for": "0s",
          "labels": {
            "severity": "critical",
            "project": "retail-sync"
          },
          "annotations": {
            "summary": "Đối soát xuyên tầng DIVERGED",
            "description": "simulator audit báo tầng thừa/sai/mất (docs/17 §5). Xem runs/<id>/audit.json."
