# retail-sync — compose scaffold theo profile
#
# Dùng để spike ngày 0 (docs/06-roadmap.md) và phát triển theo từng phần.
# Không dùng cho production — xem docs/04-tech-stack.md §3 cho đường lên cloud.
#
# Cách dùng:
#   docker compose -f infra/compose.yaml --profile edge --profile central up
#   docker compose -f infra/compose.yaml --profile data up
#   docker compose -f infra/compose.yaml --profile observability up
#   docker compose -f infra/compose.yaml --profile edge --profile central --profile data --profile observability up   # nghiệm thu đầy đủ
#
# Ràng buộc bắt buộc đã áp trong file này (xem CLAUDE.md "Mười ràng buộc thiết kế"):
#   - Postgres cửa hàng: synchronous_commit=on (mặc định của Postgres, KHÔNG override sang off)
#   - Named volume cho mọi DB — không bind-mount vào OneDrive (môi trường Windows)
#   - PostgreSQL 18: image chính thức đổi quy ước — named volume mount THẲNG vào
#     /var/lib/postgresql, KHÔNG phải .../data như PG < 18. Mount sai chỗ thì container
#     từ chối khởi động ngay từ dòng log đầu tiên — xác minh thật khi dựng compose ngày
#     2026-09-18 (docker compose --profile edge up thất bại tới khi sửa).

name: retail-sync

x-postgres-common: &postgres-common
  image: postgres:18
  restart: unless-stopped
  # pg_stat_statements — ADR-009, docs/04-tech-stack.md: "gần như miễn phí", bật cho MỌI
  # Postgres (kể cả airflow-db) thay vì bật lẻ tẻ. `track=all` (khác mặc định `top`) để
  # thấy cả câu lệnh bên trong hàm PL/pgSQL — chính là nơi các trigger bất biến
  # (INV-2/INV-3) và `ensure_point_ledger_partitions()` chạy.
  # Cần shared_preload_libraries ở tham số khởi động (không set được qua ALTER SYSTEM lúc
  # DB đã chạy), rồi CREATE EXTENSION qua migration Alembic (xem 0002_*.py).
  command: [
    "postgres",
    "-c", "shared_preload_libraries=pg_stat_statements",
    "-c", "pg_stat_statements.track=all",
  ]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 5s
    timeout: 5s
    retries: 10

# Biến của `packages/pipeline` (S4/S5 + bộ giám sát luồng), cùng tên với CLI `python -m pipeline`
# và profile dbt — dùng chung cho Airflow và `flow-monitor`, một chỗ khai báo.
x-pipeline-env: &pipeline-env
  PIPELINE_PG_DSN: postgresql://${CENTRAL_DB_USER:-central_app}:${CENTRAL_DB_PASSWORD}@central-db:5432/central
  PIPELINE_WINDOW_SECONDS: ${PIPELINE_WINDOW_SECONDS:-3600}
  PIPELINE_SAFETY_LAG_SECONDS: ${PIPELINE_SAFETY_LAG_SECONDS:-30}
  LAKE_ENDPOINT: minio:9000
  LAKE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  LAKE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  LAKE_URL_FOR_CLICKHOUSE: http://minio:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dw}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_DB: dw

# Airflow 3 (profile: data) — một image, nhiều tiến trình. Biến PIPELINE_*/LAKE_*/CLICKHOUSE_*
# cùng tên với CLI `python -m pipeline` và profile dbt, để DAG và máy dev chạy cùng một code.
x-airflow-common: &airflow-common
  build: { context: ../, dockerfile: infra/docker/airflow.Dockerfile }
  image: retail-sync-airflow:3.3.2
  profiles: ["data"]
  restart: unless-stopped
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?bắt buộc đặt trong .env}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # DAG chạy theo lịch ngay khi được đọc: đây là luồng dữ liệu cần chạy, không phải ví dụ.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    PIPELINE_SCHEDULE: ${PIPELINE_SCHEDULE:-5 * * * *}
    <<: *pipeline-env
  volumes:
    - ../data_platform/airflow/dags:/opt/airflow/dags:ro
    - ../data_platform/dbt:/opt/airflow/dbt:ro

services:

  # ═══════════════════════ EDGE (profile: edge) ═══════════════════════
  # Mô phỏng store-001. store-002, store-003 ở profile `edge-multi` bên dưới.

  edge-db-store-001:
    <<: *postgres-common
    profiles: ["edge"]
    environment:
      POSTGRES_USER: ${EDGE_DB_USER:-edge_app}
      POSTGRES_PASSWORD: ${EDGE_DB_PASSWORD:?bắt buộc đặt trong .env}
      POSTGRES_DB: edge_store_001
    ports: ["5433:5432"]
    volumes:
      - edge_db_store_001:/var/lib/postgresql  # PG 18: mount thẳng, không phải .../data
    # KHÔNG set synchronous_commit=off — cửa hàng không có UPS (ràng buộc #1)

  edge-cache-store-001:
    image: redis:7-alpine
    profiles: ["edge"]
    restart: unless-stopped
    ports: ["6380:6379"]
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - edge_cache_store_001:/data

  edge-api-store-001:
    build: { context: ../, dockerfile: infra/docker/app.Dockerfile }
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      edge-db-store-001: { condition: service_healthy }
    environment:
      STORE_ID: store-001
      DATABASE_URL: postgresql+asyncpg://${EDGE_DB_USER:-edge_app}:${EDGE_DB_PASSWORD}@edge-db-store-001:5432/edge_store_001
      REDIS_URL: redis://edge-cache-store-001:6379/0
      CENTRAL_API_URL: http://central-api:8000
      # Khóa băm SĐT — PHẢI giống nhau ở mọi cửa hàng và trung tâm (shared/pii.py).
      PII_HASH_KEY: ${PII_HASH_KEY:-changeme-dev-pii-hash-key}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: edge-api-store-001
      OTEL_RESOURCE_ATTRIBUTES: store.id=store-001
    ports: ["8001:8000"]

  # Cùng image với edge-api, khác câu lệnh: vòng đời khác hẳn (chạy nền, không phục
  # vụ request) nên vẫn là tiến trình riêng (ADR-003).
  edge-sync-worker-store-001:
    build: { context: ../, dockerfile: infra/docker/app.Dockerfile }
    command: ["python", "-m", "edge.sync.worker"]
    profiles: ["edge"]
    restart: unless-stopped
    depends_on:
      edge-db-store-001: { condition: service_healthy }
    environment:
      STORE_ID: store-001
      DATABASE_URL: postgresql+asyncpg://${EDGE_DB_USER:-edge_app}:${EDGE_DB_PASSWORD}@edge-db-store-001:5432/edge_store_001
      CENTRAL_API_URL: http://central-api:8000
      # Khóa do trung tâm cấp cho RIÊNG cửa hàng này: `make provision-store STORE_ID=store-001`.
      # Rỗng → worker thoát ngay với hướng dẫn, thay vì nhận 401 mãi mãi. Nhân bản cửa hàng
      # thì mỗi cửa hàng một biến khóa riêng — trung tâm từ chối sự kiện mang danh cửa hàng khác.
      CENTRAL_API_KEY: ${CENTRAL_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: sync-worker-store-001

  # ═══════════════════════ EDGE ×3 (profile: edge-multi) ═══════════════════════
  # store-002, store-003 — bản sao của store-001 cho cổng A ("t0 3 cửa hàng chạy 2 giờ", docs/06)
  # và AT-04 nhiều cửa hàng. Profile riêng để `--profile edge` mặc định vẫn là MỘT cửa hàng
  # (~250 MB mỗi stack). Mỗi cửa hàng một khóa: CENTRAL_API_KEY_STORE_00N (make provision-store).

  edge-db-store-002:
    <<: *postgres-common
    profiles: ["edge-multi"]
    environment:
      POSTGRES_USER: ${EDGE_DB_USER:-edge_app}
      POSTGRES_PASSWORD: ${EDGE_DB_PASSWORD:?bắt buộc đặt trong .env}
      POSTGRES_DB: edge_store_002
    ports: ["5435:5432"]
    volumes:
      - edge_db_store_002:/var/lib/postgresql

  edge-cache-store-002:
    image: redis:7-alpine
    profiles: ["edge-multi"]
    restart: unless-stopped
    ports: ["6381:6379"]
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - edge_cache_store_002:/data

  edge-api-store-002:
    build: { context: ../, dockerfile: infra/docker/app.Dockerfile }
    profiles: ["edge-multi"]
    restart: unless-stopped
    depends_on:
      edge-db-store-002: { condition: service_healthy }
    environment:
      STORE_ID: store-002
      DATABASE_URL: postgresql+asyncpg://${EDGE_DB_USER:-edge_app}:${EDGE_DB_PASSWORD}@edge-db-store-002:5432/edge_store_002
      REDIS_URL: redis://edge-cache-store-002:6379/0
      CENTRAL_API_URL: http://central-api:8000
      PII_HASH_KEY: ${PII_HASH_KEY:-changeme-dev-pii-hash-key}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: edge-api-store-002
      OTEL_RESOURCE_ATTRIBUTES: store.id=store-002
    ports: ["8002:8000"]

  edge-sync-worker-store-002:
    build: { context: ../, dockerfile: infra/docker/app.Dockerfile }
    command: ["python", "-m", "edge.sync.worker"]
    profiles: ["edge-multi"]
    restart: unless-stopped
    depends_on:
      edge-db-store-002: { condition: service_healthy }
    environment:
      STORE_ID: store-002
      DATABASE_URL: postgresql+asyncpg://${EDGE_DB_USER:-edge_app}:${EDGE_DB_PASSWORD}@edge-db-store-002:5432/edge_store_002
      CENTRAL_API_URL: http://central-api:8000
      CENTRAL_API_KEY: ${CENTRAL_API_KEY_STORE_002:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: sync-worker-store-002

  edge-db-store-003:
    <<: *postgres-common
    profiles: ["edge-multi"]
    environment:
      POSTGRES_USER: ${EDGE_DB_USER:-edge_app}
      POSTGRES_PASSWORD: ${EDGE_DB_PASSWORD:?bắt buộc đặt trong .env}
      POSTGRES_DB: edge_store_003
    ports: ["5436:5432"]
    volumes:
      - edge_db_store_003:/var/lib/postgresql

  edge-cache-store-003:
    image: redis:7-alpine
    profiles: ["edge-multi"]
    restart: unless-stopped
    ports: ["6382:6379"]
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - edge_cache_store_003:/data

  edge-api-store-003:
    build: { context: ../, dockerfile: infra/docker/app.Dockerfile }
    profiles: ["edge-multi"]
    restart: unless-stopped
    depends_on:
      edge-db-store-003: { condition: service_healthy }
    environment:
      STORE_ID: store-003
      DATABASE_URL: postgresql+asyncpg://${EDGE_DB_USER:-edge_app}:${EDGE_DB_PASSWORD}@edge-db-store-003:5432/edge_store_003
      REDIS_URL: redis://edge-cache-store-003:6379/0
      CENTRAL_API_URL: http://central-api:8000
      PII_HASH_KEY: ${PII_HASH_KEY:-changeme-dev-pii-hash-key}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: edge-api-store-003
      OTEL_RESOURCE_ATTRIBUTES: store.id=store-003
    ports: ["8003:8000"]

  edge-sync-worker-store-003:
    build: { context: ../, dockerfile: infra/docker/app.Dockerfile }
    command: ["python", "-m", "edge.sync.worker"]
    profiles: ["edge-multi"]
    restart: unless-stopped
    depends_on:
      edge-db-store-003: { condition: service_healthy }
    environment:
      STORE_ID: store-003
      DATABASE_URL: postgresql+asyncpg://${EDGE_DB_USER:-edge_app}:${EDGE_DB_PASSWORD}@edge-db-store-003:5432/edge_store_003
      CENTRAL_API_URL: http://central-api:8000
      CENTRAL_API_KEY: ${CENTRAL_API_KEY_STORE_003:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: sync-worker-store-003

  # ═══════════════════════ CENTRAL (profile: central) ═══════════════════════

  central-db:
    <<: *postgres-common
    profiles: ["central"]
    environment:
      POSTGRES_USER: ${CENTRAL_DB_USER:-central_app}
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD:?bắt buộc đặt trong .env}
      POSTGRES_DB: central
    ports: ["5434:5432"]
    volumes:
      - central_db:/var/lib/postgresql

  central-api:
    build: { context: ../, dockerfile: infra/docker/app.Dockerfile }
    command: ["uvicorn", "central.main:app", "--host", "0.0.0.0", "--port", "8000"]
    profiles: ["central"]
    restart: unless-stopped
    depends_on:
      central-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${CENTRAL_DB_USER:-central_app}:${CENTRAL_DB_PASSWORD}@central-db:5432/central
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_SERVICE_NAME: central-api
    ports: ["8000:8000"]

  # Job đối soát INV-4 tăng dần theo lịch (ràng buộc #8, DI-1, AT-10). Tới 2026-09-25 nó chỉ chạy
  # tay — dashboard "sức khỏe luồng" lộ ra điều đó. Chỉ BÁO lệch (bảng `reconciliation_drift`),
  # không tự sửa: sửa snapshot điểm là sửa tiền của khách.
  central-reconcile:
    build: { context: ../, dockerfile: infra/docker/app.Dockerfile }
    command: ["python", "-m", "central.ops.reconcile", "--every", "${RECONCILE_INTERVAL_SECONDS:-3600}"]
    profiles: ["central"]
    restart: unless-stopped
    depends_on:
      central-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://${CENTRAL_DB_USER:-central_app}:${CENTRAL_DB_PASSWORD}@central-db:5432/central

  # ═══════════════════════ DATA PLATFORM (profile: data) ═══════════════════════

  minio:
    # Docker Hub `minio/minio` KHÔNG còn tồn tại (pull trả "repository does not exist",
    # 2026-09-24) — MinIO chỉ còn phát hành image qua quay.io. Ghim bản cụ thể: `latest` của một
    # nguồn phát hành vừa đổi chính sách là thứ không nên tin (docs/adr/005 §Rủi ro nguồn cung).
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["data"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?bắt buộc đặt trong .env}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    profiles: ["data"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?bắt buộc đặt trong .env}
      CLICKHOUSE_DB: dw
    ports: ["8123:8123", "9002:9000"]
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  # Airflow 3 — LocalExecutor (ADR-007): KHÔNG dùng Celery worker/Redis riêng.
  #
  # Airflow 3 khác Airflow 2 ở ba chỗ làm compose cũ chết (sửa 2026-09-24):
  #   - `airflow webserver` đã bị BỎ → `airflow api-server` (UI + REST + Execution API).
  #   - `dag-processor` là tiến trình RIÊNG, bắt buộc — thiếu nó thì không DAG nào được đọc.
  #   - Task không còn nói chuyện thẳng với DB metadata mà qua Execution API của api-server,
  #     xác thực bằng JWT: mọi thành phần phải dùng CHUNG `jwt_secret` (không đặt thì mỗi tiến
  #     trình tự sinh một khóa, và task chết với "Signature verification failed") và trỏ
  #     `execution_api_server_url` về api-server.
  # Không có triggerer: chưa dùng deferrable operator nào — bớt một tiến trình (~300 MB, spike S1).
  airflow-db:
    <<: *postgres-common
    profiles: ["data"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?bắt buộc đặt trong .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql

  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      airflow-db: { condition: service_healthy }
    command: ["airflow", "db", "migrate"]

  airflow-api-server:
    <<: *airflow-common
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    # Chỉ nghe trên máy này: SimpleAuthManager ở chế độ "ai cũng là admin" (dev, không login).
    ports: ["127.0.0.1:8081:8080"]
    command: ["airflow", "api-server"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      airflow-api-server: { condition: service_healthy }
    command: ["airflow", "scheduler"]

  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    command: ["airflow", "dag-processor"]

  # ═══════════════════════ BI (profile: bi) ═══════════════════════

  metabase:
    image: metabase/metabase:latest
    profiles: ["bi"]
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

  # ═══════════════════════ OBSERVABILITY (profile: observability) ═══════════════════════
  # ADR-009 — 1 container thay vì SigNoz (4-8GB). Chỉ bật khi cần săn bottleneck.

  otel-lgtm:
    # Ghim bản (0.33.0 = Grafana 13.2.1, Prometheus nhận OTLP): `latest` đổi cấu hình bên trong
    # (đường dẫn provisioning, cách dịch tên metric) mà không báo — dashboard và test tên metric
    # dựa đúng vào những thứ đó (shared/metrics.py, kiểm trên bản này 2026-09-25).
    image: grafana/otel-lgtm:0.33.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "3001:3000"   # Grafana UI (đổi cổng để không đụng Metabase :3000)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      # Prometheus/Tempo/Loki ghi ở /data: không có volume thì mỗi lần container khởi động lại
      # là mất sạch lịch sử — test ngâm 72h (docs/08 §6.2) cần đúng cái lịch sử đó.
      - otel_lgtm_data:/data
      # Dashboard "sức khỏe luồng" (docs/17 §6) — file trong repo, provision lúc khởi động.
      - ./observability/grafana/provisioning/retail-sync.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/retail-sync.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/retail-sync-dashboards:ro

  # Bộ giám sát luồng (`python -m pipeline monitor`, packages/pipeline/monitor.py): đọc trạng thái
  # S3–S6 (Postgres trung tâm, lake, ClickHouse) mỗi 30 s, đẩy OTLP cho dashboard. Chỉ ĐỌC.
  # Image Airflow vì nó đã có đúng `packages/pipeline` + pyarrow + OTel SDK — không thêm image.
  # Profile `observability`: nó chỉ có ích khi có chỗ nhận metric. Không `depends_on` các nguồn:
  # nguồn chưa lên thì nó báo `flow_monitor_source_up = 0` rồi đo lại lượt sau.
  flow-monitor:
    build: { context: ../, dockerfile: infra/docker/airflow.Dockerfile }
    image: retail-sync-airflow:3.3.2
    profiles: ["observability"]
    restart: unless-stopped
    entrypoint: ["python", "-m", "pipeline", "monitor"]
    environment:
      <<: *pipeline-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      FLOW_MONITOR_INTERVAL_SECONDS: ${FLOW_MONITOR_INTERVAL_SECONDS:-30}

volumes:
  edge_db_store_001:
  edge_cache_store_001:
  edge_db_store_002:
  edge_cache_store_002:
  edge_db_store_003:
  edge_cache_store_003:
  central_db:
  minio_data:
  clickhouse_data:
  airflow_db:
  metabase_data:
  otel_lgtm_data:
