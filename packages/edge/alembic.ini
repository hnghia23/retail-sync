# Alembic config for the edge database.
#
# Run:  uv run alembic -c packages/edge/alembic.ini upgrade head
#
# ASCII ONLY in this file. Alembic reads it with ConfigParser using the *locale*
# encoding, which is cp1252 on a default Windows install -- any non-ASCII byte here
# raises UnicodeDecodeError before a single migration runs. Vietnamese notes belong
# in migrations/env.py instead (Python source is always read as UTF-8).
#
# The database URL is NOT stored here: env.py reads DATABASE_URL from the environment.
# See docs/09-v1-postmortem.md O1 -- v1 hardcoded secrets in config files.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = packages
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
