{% extends "_layout.html" %}
{% block title %}Đăng nhập — retail-sync POS{% endblock %}
{% block body %}
  <h1>retail-sync — {{ store_id }}</h1>
  <form id="login-form" hx-post="/ui/login" hx-target="#login-form" hx-swap="outerHTML">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <p>
      <label>Mã nhân viên<br>
        <input type="text" name="employee_id" value="{{ employee_id or '' }}" required autofocus>
      </label>
    </p>
    <p>
      <label>Mật khẩu<br>
        <input type="password" name="password" required>
      </label>
    </p>
    <button type="submit">Đăng nhập</button>
  </form>
{% endblock %}
